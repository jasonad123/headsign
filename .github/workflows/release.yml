name: Generate releases

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if prerelease
        id: check_prerelease
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" =~ (alpha|beta|rc|RC|backport) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Read codename
        id: codename
        run: echo "name=$(node -p "require('./package.json').codename || ''")" >> $GITHUB_OUTPUT

      - name: Generate release
        if: steps.check_prerelease.outputs.is_prerelease == 'false'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          name: ${{ github.ref_name }}${{ steps.codename.outputs.name && format(' ''{0}''', steps.codename.outputs.name) || '' }}
          generate_release_notes: true